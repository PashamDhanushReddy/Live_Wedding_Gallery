services:
  - type: web
    name: live-wedding-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "daphne config.asgi:application --port $PORT --bind 0.0.0.0"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: live-wedding-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: live-wedding-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: redis
    name: live-wedding-redis
    ipAllowList: [] # only allow internal connections

databases:
  - name: live-wedding-db
    databaseName: wedding
    user: wedding_user
